# Local reverse proxy — single entrypoint on the published port (default 8080).
#   /                    -> web-app (Angular SPA)
#   /fineract-provider/  -> Fineract backend (internal HTTPS, self-signed -> verify off)
# The browser only ever speaks plain HTTP to this one origin, so there are no
# CORS or mixed-content issues, and the self-signed backend cert never reaches the browser.

upstream fineract_backend {
    server fineract:8443;
}

upstream webapp_frontend {
    server webapp:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # ---- Fineract REST API ----
    location /fineract-provider/ {
        proxy_pass https://fineract_backend/fineract-provider/;
        proxy_ssl_verify off;                       # backend uses a self-signed cert internally
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Fineract forces HTTPS on /api/v1 and honors X-Forwarded-Proto. TLS terminates here at
        # nginx and the backend hop is HTTPS, so advertise the channel as secure to avoid 302 loops.
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # ---- Frontend SPA ----
    location / {
        proxy_pass http://webapp_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
